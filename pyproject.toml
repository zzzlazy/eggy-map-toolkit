[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eggy-map-api"
version = "0.2.0"
description = "Fail-closed offline planning and reconciliation for editable Eggy maps"
readme = "README.md"
license = "MIT"
authors = [{name = "zzzlazy"}]
requires-python = ">=3.11"
dependencies = [
  "mcp==2.1.1",
  "msgpack==1.2.2",
  "pydantic==2.13.5",
  "zstandard==0.25.0",
]

[project.scripts]
eggy-map-mcp = "eggy_map_mcp.server:main"
eggy-map-build-catalog = "eggy_map_api.catalog_bundle:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/zzzlazy/eggy-map-toolkit"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
